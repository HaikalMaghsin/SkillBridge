<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login · SkillBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-main">
      <article class="auth-card card">
        <div class="auth-logo">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 800">S</div>
          <span>SkillBridge</span>
        </div>

        <h1 style="font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 8px">Welcome back</h1>
        <p style="text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px">Sign in to your account to continue building your portfolio.</p>

        <form id="login-form" style="display: grid; gap: 16px">
          <input type="hidden" name="csrf_token" />

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; height: 44px">Sign In</button>
        </form>

        <p style="text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 20px">
          Don't have an account?
          <a href="register.html" style="color: var(--primary); font-weight: 700; text-decoration: none">Register now</a>
        </p>
      </article>
    </main>

    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pages/login.js"></script>
  </body>
</html>
